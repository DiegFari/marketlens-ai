# Local stack mirroring production: the API plus the web frontend behind Caddy.
#   docker compose up --build   ->  http://localhost:8080
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      LOG_FORMAT: console
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      SITE_ADDRESS: ":80"   # plain HTTP locally; a host name in production enables HTTPS
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
