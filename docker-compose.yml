# Local stack mirroring the Azure topology: two independent services.
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      LOG_FORMAT: console
      CORS_ORIGINS: http://localhost:8501
    ports:
      - "8000:8000"

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    environment:
      UI_API_BASE_URL: http://api:8000
      UI_LOG_FORMAT: console
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
