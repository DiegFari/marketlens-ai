[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "marketlens-ai"
dynamic = ["version"]
description = "Multi-agent financial intelligence platform built on Azure OpenAI and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Private :: Do Not Upload",
]
# Shared by every deployable (API + UI).
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "langgraph>=1.2,<2",
    "langchain-core>=1.7,<2",
    "langchain-openai>=1.7,<2",
]
ui = [
    "streamlit>=1.40,<2",
]
# Pinned so CI checks exactly what was verified locally (linters add rules over time).
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "pre-commit>=4.0",
]

[tool.hatch.version]
path = "src/marketlens/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/marketlens"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "SIM",      # simplify
    "C4",       # comprehensions
    "S",        # bandit (security)
    "PT",       # pytest style
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["marketlens", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are the point of tests
"scripts/**" = ["E501"]  # report templates (Markdown tables) read better unwrapped

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["marketlens"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # makes `tests.support` importable under importlib mode
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"

[tool.coverage.run]
source = ["marketlens"]
branch = true
omit = ["src/marketlens/ui/app.py", "src/marketlens/ui/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
