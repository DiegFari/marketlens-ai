# Production stack for a single small Linux server (e.g. a 1-core / 2 GB VPS).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only the web container (Caddy) is reachable from the internet, on ports 80/443 with
# automatic HTTPS. It serves the React app and proxies the public API routes; the API
# publishes no ports. See docs/deploy.md.
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      LOG_FORMAT: json
      ENVIRONMENT: prod
      WEB_CONCURRENCY: "1"        # one core; also keeps the in-memory cache and limits shared
      DEMO_LIMITS_ENABLED: "true" # protect the free API quotas from public traffic
      LLM_MAX_RETRIES: "6"        # ride out the model's tokens-per-minute limit
    restart: unless-stopped
    mem_limit: 900m

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    mem_limit: 200m
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:     # HTTPS certificates; keep it so they are not re-issued on restart
  caddy_config:
